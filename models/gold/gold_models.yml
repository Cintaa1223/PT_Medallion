version: 2

models:
  - name: gold_dim_customer
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: gold_dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: gold_fact_sales
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - line_number
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_dim_customer')
                field: customer_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_dim_date')
                field: date_id